<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

<body>
   <form method="get" action="../exemplos html/home.html">
        <h1> Pesquisa sobre meios de transporte!</h1>

        <imput type="date" id="nascimento" name="nascimento"> <br> <br>

            <p><strong>Meios de transporte uttilizado</strong></p>

        <input type="checkbox" id="Carro" name="transporte" value="carro">Eu tenho um carro<br>
        <label for="carro" >Carro</label><br> 

        <input type="checkbox" id="moto" name="transporte" value="moto">Eu tenho uma moto <br> <br>
        <label for="moto">Moto</label><br>

        <label for="onibus">ônibus</label><br>

        <label for="aplicativo">Aplicativo de transporte</label><br>

        <input type="checkbox" id="caminhada" name="transporte value="Caminhada">Eu faço caminhada <br> <br>
        <label for="caminhada">Caminhada</label><br><br>

        <label for="veiculos">Quantidade de veiculos que possui:</label><br>
        <imput type="number" id=""veiculos" name="veiculos" min="0" max="5"><br><br>

                <label for="comentario">satisfacao com o transporte publico:</label><br>
        <textarea id="comentario" name="comentario" rows="5" cols="40" required></textarea>

        <br><br>

        <button type="submit">Enviar pesquisa</button>
        <button type="button" onclick="Agradecimento"
        </button>

    </form>
